<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="#4DE3FF" stroke-width="1.2">
  <!-- Method 1: COLLECT — scattered points drifting toward clusters -->
  <rect x="0.5" y="0.5" width="599" height="399" opacity="0.25"/>
  <line x1="24" y1="368" x2="576" y2="368" opacity="0.3"/>
  <line x1="24" y1="32" x2="24" y2="368" opacity="0.3"/>
  <g opacity="0.18" stroke-dasharray="2 6">
    <line x1="24" y1="116" x2="576" y2="116"/>
    <line x1="24" y1="200" x2="576" y2="200"/>
    <line x1="24" y1="284" x2="576" y2="284"/>
    <line x1="162" y1="32" x2="162" y2="368"/>
    <line x1="300" y1="32" x2="300" y2="368"/>
    <line x1="438" y1="32" x2="438" y2="368"/>
  </g>
  <!-- scattered source points -->
  <g fill="#4DE3FF" stroke="none" opacity="0.55">
    <circle cx="70" cy="80" r="2"/><circle cx="120" cy="140" r="1.6"/><circle cx="90" cy="230" r="2.2"/>
    <circle cx="150" cy="300" r="1.8"/><circle cx="60" cy="320" r="1.5"/><circle cx="180" cy="90" r="1.7"/>
    <circle cx="210" cy="180" r="2"/><circle cx="250" cy="70" r="1.5"/><circle cx="240" cy="260" r="1.8"/>
    <circle cx="140" cy="200" r="1.4"/><circle cx="200" cy="330" r="1.6"/><circle cx="110" cy="50" r="1.3"/>
  </g>
  <!-- drift arrows toward clusters -->
  <g opacity="0.6">
    <path d="M120 140 Q 220 120 330 118" stroke-dasharray="4 4" marker-end="url(#arr1)"/>
    <path d="M210 180 Q 270 170 332 148" stroke-dasharray="4 4" marker-end="url(#arr1)"/>
    <path d="M240 260 Q 300 250 372 236" stroke-dasharray="4 4" marker-end="url(#arr1)"/>
    <path d="M150 300 Q 250 290 380 258" stroke-dasharray="4 4" marker-end="url(#arr1)"/>
  </g>
  <defs>
    <marker id="arr1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#4DE3FF"/>
    </marker>
  </defs>
  <!-- cluster A -->
  <circle cx="352" cy="128" r="46" opacity="0.4"/>
  <circle cx="352" cy="128" r="46" opacity="0.9" stroke-dasharray="1 7"/>
  <g fill="#4DE3FF" stroke="none">
    <circle cx="340" cy="116" r="3"/><circle cx="366" cy="122" r="2.4"/><circle cx="352" cy="142" r="2.8"/>
    <circle cx="334" cy="136" r="2"/><circle cx="372" cy="140" r="1.8"/><circle cx="356" cy="104" r="1.6"/>
  </g>
  <!-- cluster B -->
  <circle cx="402" cy="248" r="38" opacity="0.4"/>
  <circle cx="402" cy="248" r="38" opacity="0.9" stroke-dasharray="1 7"/>
  <g fill="#4DE3FF" stroke="none">
    <circle cx="394" cy="238" r="2.8"/><circle cx="414" cy="246" r="2.2"/><circle cx="400" cy="262" r="2.5"/>
    <circle cx="388" cy="254" r="1.8"/><circle cx="416" cy="262" r="1.5"/>
  </g>
  <!-- HUD annotations -->
  <g stroke="#4DE3FF" opacity="0.8">
    <path d="M470 96 h14 M477 89 v14" stroke-width="1"/>
    <path d="M470 96 m-10 0 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0" opacity="0.5"/>
  </g>
  <text x="492" y="100" fill="#4DE3FF" stroke="none" font-family="monospace" font-size="11" letter-spacing="2">CLUSTER-01</text>
  <text x="452" y="300" fill="#4DE3FF" stroke="none" font-family="monospace" font-size="11" letter-spacing="2">CLUSTER-02</text>
  <text x="40" y="352" fill="#4DE3FF" stroke="none" font-family="monospace" font-size="12" letter-spacing="3">01 / COLLECT · 采集</text>
  <g opacity="0.9">
    <path d="M12 12 h16 M12 12 v16 M588 12 h-16 M588 12 v16 M12 388 h16 M12 388 v-16 M588 388 h-16 M588 388 v-16"/>
  </g>
</svg>
